[project]
name = "notebattle"
version = "0.0.7"
description = "Deprecated compatibility distribution; install funbattle instead"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["funbattle>=0.0.8"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/farfarfun/funbattle"
Migration = "https://github.com/farfarfun/funbattle#从-notebattle-迁移"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebattle"]
