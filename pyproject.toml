[project]
name = "funbattle"
version = "0.0.8"
description = "数据竞赛代码归档：按赛事 ID 分目录存放 DataFountain 等比赛的可导入入口"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = ["tqdm>=4.60"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funbattle"]
